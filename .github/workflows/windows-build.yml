name: Windows build and release
run-name: ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

# Tag push and release.published can describe the same version. Hold the lock
# across validation, build, package AND upload; a later event then checks the
# completed release before deciding to build. Never interrupt an active upload.
# Use a different key from the publisher job lock (also used by older workflows).
concurrency:
  group: ${{ (github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && format('release-workflow-{0}', github.ref_name) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: Prepare event
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.event.outputs.publish }}
      tag: ${{ steps.event.outputs.tag }}
      commit: ${{ steps.event.outputs.commit }}
      release_id: ${{ steps.event.outputs.release_id }}
      needs_build: ${{ steps.event.outputs.needs_build }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate event and check for an already verified release
        id: event
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Prepare-CiEvent.ps1
      - name: Test release policies and safe publishing without remote writes
        run: |
          ./scripts/Test-PackageSupport.ps1
          ./scripts/Test-ReleasePolicy.ps1
          ./scripts/Test-ReleasePublish.ps1
          ./scripts/Test-ReleaseBuild.ps1
          ./scripts/Test-CiValidation.ps1
      - name: Preserve event validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-prepare-${{ github.sha }}
          overwrite: true
          path: target/ci-logs/prepare/
          if-no-files-found: warn
          retention-days: 30

  build:
    name: ${{ matrix.generator }} / ${{ matrix.configuration }}
    needs: prepare
    if: needs.prepare.outputs.needs_build == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        generator: [vs2026, ninja]
        configuration: [Debug, Release]
    steps:
      - name: Check out the verified event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure, build and test
        env:
          BUILD_GENERATOR: ${{ matrix.generator }}
          BUILD_CONFIGURATION: ${{ matrix.configuration }}
        run: ./scripts/Invoke-CiBuild.ps1 -Generator $env:BUILD_GENERATOR -Configuration $env:BUILD_CONFIGURATION
      - name: Preserve canonical Release input for the gated packaging job
        if: matrix.generator == 'vs2026' && matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ needs.prepare.outputs.commit }}
          overwrite: true
          path: |
            target/Release/Object_Connect.exe
            target/Release/build-info.json
            target/Release/Resources/
          if-no-files-found: error
          retention-days: 1
      - name: Preserve symbols separately from the player package
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-${{ matrix.generator }}-${{ matrix.configuration }}-${{ needs.prepare.outputs.commit }}
          overwrite: true
          path: |
            target/${{ matrix.configuration }}/Object_Connect.pdb
            target/${{ matrix.configuration }}/build-info.json
            third_party/KamataEngine/External/KamataEngine/lib/${{ matrix.configuration }}/*.pdb
            third_party/KamataEngine/External/DirectXTex/lib/${{ matrix.configuration }}/*.pdb
          if-no-files-found: error
          retention-days: 30
      - name: Preserve logs even when a build fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-${{ matrix.generator }}-${{ matrix.configuration }}-${{ needs.prepare.outputs.commit }}
          overwrite: true
          path: |
            target/ci-logs/
            build/**/Testing/Temporary/
            build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Package verified Release
    needs: [prepare, build]
    if: needs.prepare.outputs.needs_build == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ needs.prepare.outputs.commit }}
          path: target/Release
      - name: Validate imports, resources and provenance; create ZIP and checksum
        env:
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          ./scripts/Test-PackageIntegration.ps1
          if ($env:PUBLISH_RELEASE -eq 'true') {
            ./Package.ps1 -Version $env:RELEASE_TAG
          } else {
            ./Package.ps1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: player-package-${{ needs.prepare.outputs.commit }}
          overwrite: true
          path: target/packages/BloodLine-windows-x64-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  validation:
    name: CI validation
    # A skipped matrix must not accidentally satisfy a required branch check.
    # Only a verified, already-published formal release may skip the build.
    needs: [prepare, build, package]
    if: always()
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    steps:
      - name: Require all necessary validation jobs to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          NEEDS_BUILD: ${{ needs.prepare.outputs.needs_build }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PREPARE_RESULT -cne 'success') { throw 'Event validation failed or was cancelled.' }
          if ($env:PUBLISH_RELEASE -cnotin @('true', 'false')) { throw 'Missing or invalid event classification.' }
          if ($env:NEEDS_BUILD -ceq 'true') {
            if ($env:BUILD_RESULT -cne 'success' -or $env:PACKAGE_RESULT -cne 'success') {
              throw 'All four builds/tests and the package checks must succeed.'
            }
            Write-Host 'CI validation passed: all four builds/tests and package checks succeeded.'
          } elseif ($env:NEEDS_BUILD -ceq 'false' -and $env:PUBLISH_RELEASE -ceq 'true' -and
                    $env:BUILD_RESULT -ceq 'skipped' -and $env:PACKAGE_RESULT -ceq 'skipped') {
            Write-Host 'CI validation passed: this exact release was already built, tested and verified. Duplicate build skipped.'
          } else {
            throw 'Unexpected validation state; a skipped build cannot pass the required check.'
          }

  release:
    name: Publish or complete GitHub Release
    needs: [prepare, package, validation]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.needs_build == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      # Execute only the helper from the verified master-ancestor commit whose
      # four builds, package checks and mock publishing tests have all passed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: player-package-${{ needs.prepare.outputs.commit }}
          path: package
      - name: Verify current tag and safely add missing release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          EXPECTED_RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          $parameters = @{
            Tag = $env:RELEASE_TAG
            ExpectedCommit = $env:RELEASE_COMMIT
            PackageDirectory = 'package'
          }
          if ($env:EXPECTED_RELEASE_ID) { $parameters.ExpectedReleaseId = $env:EXPECTED_RELEASE_ID }
          ./scripts/Publish-Release.ps1 @parameters
